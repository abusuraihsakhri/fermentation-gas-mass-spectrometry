name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Python syntax and tests
        run: |
          python -m compileall -q agents offgas_analyzer cli.py enrichment.py
          python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: JavaScript syntax and calculations
        run: |
          node --check site/app.mjs
          node --check site/offgas.mjs
          node --test site/offgas.test.mjs
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("web/index.html").read_text()
          match = re.search(r"<script>(.*?)</script>", source, flags=re.S)
          assert match, "Backend console script missing"
          Path("/tmp/offgas-console.js").write_text(match.group(1))
          PY
          node --check /tmp/offgas-console.js

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies and auditor
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install .
          python -m pip install pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config -q
      - name: Build production Docker image
        run: docker build -t offgas-ci .
      - name: Check container HTTP workflow
        run: |
          set -euo pipefail
          docker run -d --name offgas-ci -p 127.0.0.1:8000:8000 offgas-ci
          trap 'docker rm -f offgas-ci' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q 'Operations Console'
          curl -fsS http://127.0.0.1:8000/api/offgas/calculate \
            -H 'Content-Type: application/json' \
            -d '{"inlet_flow_mmol_min":100,"inlet_o2":0.21,"inlet_co2":0,"outlet_o2":0.16,"outlet_co2":0.04}' > /tmp/response.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/response.json').read_text())
          assert abs(result['rq'] - (3.95 / 5.2)) < 1e-10
          PY
