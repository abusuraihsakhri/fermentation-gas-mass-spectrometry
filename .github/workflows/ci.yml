name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Python syntax and tests
        run: |
          python -m compileall -q agents offgas_analyzer cli.py enrichment.py
          python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax and calculations
        run: |
          node --check site/app.mjs
          node --check site/offgas.mjs
          node --test site/offgas.test.mjs
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("web/index.html").read_text()
          match = re.search(r"<script>(.*?)</script>", source, flags=re.S)
          assert match, "Backend console script missing"
          Path("/tmp/offgas-console.js").write_text(match.group(1))
          PY
          node --check /tmp/offgas-console.js

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies and auditor
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install .
          python -m pip install pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off
