[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fermentation-gas-mass-spectrometry"
version = "2.1.0"
description = "OffGas-Analyzer: Fermentation Respiratory Quotient (RQ) & OUR/CER Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "build>=1.2",
]

[project.scripts]
fermentation-gas-mass-spectrometry = "offgas_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fermentation-gas-mass-spectrometry"
Repository = "https://github.com/abusuraihsakhri/fermentation-gas-mass-spectrometry.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "offgas_analyzer_app"]

[tool.setuptools.packages.find]
include = ["agents*", "offgas_analyzer*"]
